name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # กำหนดให้รันคำสั่งทั้งหมดในโฟลเดอร์ products-app
    defaults:
      run:
        working-directory: ./products-app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # บอก GitHub ว่าไฟล์ล็อคแพ็กเกจอยู่ที่ไหน
          cache-dependency-path: ./products-app/package-lock.json
          
      - run: npm ci
      - run: npm run lint
      - run: npm run build